<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>iGEM Ping</title><link rel="stylesheet" href="shared.css"><link rel="stylesheet" href="settings.css"></head>
<body>
  <aside class="sidebar">
    <div class="brand"><img class="brand-symbol" src="../assets/icon.png" alt=""><span>iGEM <b>Ping</b><small data-en="A LITTLE LAB COMPANION" data-zh="陪伴每一个 iGEMer"></small></span></div>
    <div class="nav-caption" data-en="YOUR SPACE" data-zh="你的工作空间"></div>
    <button class="nav active" data-panel="home"><span data-icon="home"></span><span data-en="Companion" data-zh="桌面伙伴"></span></button>
    <button class="nav" data-panel="resources"><span data-icon="link"></span><span data-en="iGEM resources" data-zh="iGEM 官方资源"></span></button>
    <button class="nav" data-panel="preferences"><span data-icon="settings"></span><span data-en="Preferences" data-zh="偏好设置"></span></button>
    <div class="sidebar-bottom"><div class="local-badge"><span data-en="Your desktop, your space" data-zh="在你的桌面，陪你一起"></span></div><p data-en="Made for curious minds.\nOpen to every iGEMer." data-zh="为每一份好奇心。\n为全世界 iGEMer。"></p><span class="version">COMMUNITY EDITION · 0.1.0</span></div>
  </aside>
  <main>
    <header><div class="breadcrumb">iGEM Ping <span>/</span> <span id="crumb"></span></div><button id="language" class="language-label" aria-label="Switch language"><span data-icon="language"></span><span id="language-name">English</span></button><div class="window-controls"><button id="minimize" data-en="Minimize" data-zh="最小化"></button><button id="hide" data-en="Close" data-zh="关闭"></button></div></header>
    <section id="home" class="panel">
      <div class="page-heading"><div><div class="eyebrow" data-en="YOUR iGEM JOURNEY, ONE CLICK AWAY." data-zh="玩转 iGEM 官网，从这里开始。"></div><h1 data-en="Your shortcut to\nthe iGEM world." data-zh="通往 iGEM 世界，\n只需轻轻一点。"></h1></div><span class="status-pill"><span data-en="Ready when you are" data-zh="随时陪你出发"></span></span></div>
      <div class="home-grid">
        <section class="companion-card">
          <div class="card-top"><span class="small-label" data-en="GEMY, YOUR iGEM GUIDE" data-zh="GEMY，你的 iGEM 向导"></span><span class="mini-pill">Gemy</span></div>
          <div class="pet-stage"><div class="pet-speech" id="preview-speech" data-en="Where shall we explore?" data-zh="今天，我们探索哪里？"></div><button id="pet-preview" aria-label="Open ping wheel"><img src="../assets/pet.png" alt="Gemy desktop companion"></button></div>
          <div class="companion-bottom"><div><strong data-en="Official answers. Always within reach." data-zh="关键官方信息，随时触手可及。"></strong><p data-en="Click Gemy for your essential iGEM shortcuts." data-zh="点击 Gemy，打开 iGEM 必备导航。"></p></div><button id="open-wheel" class="primary"><span data-en="Open guide" data-zh="打开导航"></span><span data-icon="link"></span></button></div>
          <div class="shortcut-hint"><kbd>Ctrl</kbd><span>+</span><kbd>Alt</kbd><span>+</span><kbd>G</kbd><span data-en="your guide, from anywhere" data-zh="随时呼出你的 iGEM 向导"></span></div>
        </section>
        <section class="focus-card"><div class="card-top"><span class="small-label" data-en="A MOMENT TO FOCUS" data-zh="留一点时间给专注"></span><span class="focus-icon" data-icon="focus"></span></div><div class="timer-ring" id="timer-ring"><div><span id="timer-display">25:00</span><span class="timer-sub" id="timer-sub"></span></div></div><p class="focus-copy" data-en="One question. One small step.\nGive your idea a little room." data-zh="一个问题，一次小小的推进。\n给灵感留一点空间。"></p><form id="timer-form"><label class="duration-label"><input id="minutes" type="number" min="1" max="180" step="1" value="25" required aria-label="Focus minutes"><span data-en="minutes" data-zh="分钟"></span></label><button id="timer-toggle" class="dark-button" type="submit"></button></form><p class="timer-note" data-en="A gentle ping when your session ends." data-zh="专注结束，轻轻提醒你。"></p></section>
      </div>
      <div class="section-heading"><h2 data-en="The essentials, one tap away" data-zh="关键入口，轻点即达"></h2><span data-en="Always official. Always up to date at the source." data-zh="直达官网，最新信息以官方为准。"></span></div><div id="guide-grid" class="guide-grid"></div><details class="signals"><summary data-en="Desktop signals" data-zh="桌面信号 Ping"></summary><div id="ping-grid" class="ping-grid"></div></details>
      <div class="official-strip"><img src="../assets/igem-logo.png" alt="iGEM"><div><strong data-en="Connected to the iGEM world" data-zh="连接 iGEM 的世界"></strong><span data-en="Timelines, judging, uploads, and inspiration from past teams." data-zh="比赛进度、评审要求、上传说明与历年项目灵感。"></span></div><button class="text-button" data-go="resources"><span data-en="Explore resources" data-zh="探索官方资源"></span><span data-icon="link"></span></button></div>
    </section>
    <section id="resources" class="panel" hidden><div class="eyebrow" data-en="YOUR CONNECTION TO iGEM" data-zh="通往 iGEM 的官方入口"></div><h1 data-en="Less searching.\nMore discovering." data-zh="少一点寻找，\n多一点发现。"></h1><p class="intro" data-en="Official places for the next step in your iGEM journey. Links open in your browser." data-zh="从这里开启 iGEM 的下一步。链接将在浏览器中打开。"></p><div id="resource-grid" class="resource-grid"></div><div class="resource-note"><img src="../assets/igem-logo.png" alt="iGEM"><p data-en="These links lead to official iGEM websites. iGEM Ping is an independent community project and is not endorsed by iGEM. Always check the official website for current requirements and deadlines." data-zh="这些链接均指向 iGEM 官方网站。iGEM Ping 是独立社区项目，未获 iGEM 官方背书。最新要求及截止日期请以官网为准。"></p></div></section>
    <section id="preferences" class="panel" hidden><div class="eyebrow" data-en="MAKE YOURSELF AT HOME" data-zh="调成你喜欢的样子"></div><h1 data-en="A companion,\nyour way." data-zh="属于你的\n陪伴方式。"></h1><div class="preferences-list">
      <label class="preference"><div><strong data-en="Desktop companion" data-zh="显示桌面伙伴"></strong><p data-en="Keep Gemy close. Ctrl + Alt + P to show or hide." data-zh="让 Gemy 陪在身边。Ctrl + Alt + P 显示或隐藏。"></p></div><input id="petVisible" type="checkbox" role="switch"></label>
      <label class="preference"><div><strong data-en="Gentle sounds" data-zh="轻柔提示音"></strong><p data-en="A short, original chime for each ping." data-zh="每种 Ping 都有简短的原创合成音。"></p></div><input id="sound" type="checkbox" role="switch"></label>
      <label class="preference"><div><strong data-en="Reduce motion" data-zh="减少动态效果"></strong><p data-en="Keep the companion and feedback still." data-zh="让桌宠和反馈保持静止。"></p></div><input id="reducedMotion" type="checkbox" role="switch"></label>
      <div class="preference"><div><strong data-en="Companion size" data-zh="桌宠大小"></strong><p data-en="Find the right fit for your desktop." data-zh="给桌面留出刚刚好的空间。"></p></div><span id="petSize" class="size-options" role="group" aria-label="Companion size"><button type="button" data-size="0.8" data-en="Small" data-zh="小"></button><button type="button" data-size="1" data-en="Medium" data-zh="中"></button><button type="button" data-size="1.2" data-en="Large" data-zh="大"></button></span></div>
    </div><div class="privacy-card"><span data-icon="language"></span><div><strong data-en="Just you and your desktop." data-zh="只有你，和你的桌面。"></strong><p data-en="No account. No analytics. Preferences stay on this computer. Pings are local; share your whole screen if you want others to see them." data-zh="无需账号，没有统计追踪。偏好保存在本机。Ping 仅在本地显示；分享整个屏幕时，伙伴也能看见。"></p></div></div><p class="about-line" data-en="Gemy & iGEM identity belong to iGEM. Community-made artwork adaptation. Code: MIT · Inspired by lolPing." data-zh="Gemy 与 iGEM 标识归 iGEM 所有。社区制作的形象改编。代码采用 MIT 许可 · 交互灵感来自 lolPing。"></p><button id="quit" class="text-button" data-en="Quit iGEM Ping" data-zh="退出 iGEM Ping"></button></section>
    <div id="shortcut-warning" class="warning" role="status" hidden></div><div id="toast" role="status" aria-live="polite" hidden></div>
  </main><script type="module" src="settings.js"></script>
</body></html>
